<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>⚠️ 自动测试页（不是游戏）</title>
<style>
body{margin:0;font:14px/1.7 -apple-system,"PingFang SC",monospace;background:#1d2229;color:#d8dee6}
#banner{position:fixed;top:0;left:0;right:0;z-index:99;background:#8a2f22;color:#ffe;
  padding:8px 14px;font-size:14px;font-weight:700;text-align:center}
#wrap{display:flex;height:100vh;padding-top:36px;box-sizing:border-box}
#log{width:560px;overflow:auto;padding:14px 16px;background:#171b21}
#log h2{font-size:15px;margin:14px 0 6px;color:#8fd0ee}
.ok{color:#7fd48b}.bad{color:#ff8b7d;font-weight:700}.warn{color:#ffcf6b}
.row{white-space:pre-wrap}
iframe{flex:1;border:0;border-left:2px solid #333}
#sum{position:sticky;top:0;background:#171b21;padding:8px 0;font-size:16px;font-weight:700;border-bottom:1px solid #333}
</style>
</head>
<body>
<div id="banner">⚠️ 这是自动测试页，不是游戏。右边的宠物正在被脚本自动操作。
  <a href="index.html" style="color:#ffd479">→ 点这里去游戏</a></div>
<div id="wrap">
  <div id="log"><div id="sum">正在载入游戏…</div><div id="out"></div></div>
  <iframe id="fr" src="seed-test.html?pets=shiba,calico,golden&decor=1&nosw=1"></iframe>
</div>
<script>
const out = document.getElementById('out'), sum = document.getElementById('sum');
let pass = 0, fail = 0;
const line = (cls, t) => { const d = document.createElement('div'); d.className = 'row ' + cls; d.textContent = t; out.appendChild(d); };
const head = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
function check(name, cond, detail = '') {
  if (cond) { pass++; line('ok', '  ✓ ' + name); }
  else { fail++; line('bad', '  ✗ ' + name + (detail ? '  — ' + detail : '')); }
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function main() {
  const fr = document.getElementById('fr');
  // 等游戏起来
  let G = null;
  for (let i = 0; i < 120; i++) {
    G = fr.contentWindow.__game;
    if (G && G.pets.length) break;
    await sleep(250);
  }
  if (!G) { sum.textContent = '❌ 游戏没起来'; return; }
  const W = fr.contentWindow;
  const run = (n) => G.run(n);
  const P = () => G.pets[G.state.active];

  head('0 · 载入');
  check('游戏实例存在', !!G);
  check('宠物已生成 3 只', G.pets.length === 3, `实际 ${G.pets.length}`);
  check('无脚本错误', !W.__err, W.__err || '');
  check('背景图已加载', G.stage.bgEl.naturalWidth > 0, '图片 404?');
  // 所有贴纸都能加载
  await sleep(600);
  const imgs = [...fr.contentDocument.querySelectorAll('img')];
  const broken = imgs.filter(i => i.src && i.complete && i.naturalWidth === 0).map(i => i.src.split('/').pop());
  check('所有贴图都能加载', broken.length === 0, broken.join(', '));

  head('1 · 喂食：宠物要走到食盆边吃');
  const hearts0 = G.state.hearts;
  G.serveFood('🍖', 300, 300);
  run(20);               // 0.6s 食物飞进盆
  run(95);               // 走到盆边并开吃（吃 6 口约 3s 后它们就散开，要卡在吃的过程中检查）
  const bowlEl = fr.contentDocument.querySelector('.actor img[src*="bowl_"]').closest('.actor');
  const bowlAct = G.stage.actors.find(a => a.el === bowlEl);
  const bowlU = bowlAct.u, bowlV = bowlAct.v;
  const near = G.pets.filter(p => Math.hypot(p.u - bowlU, (p.v - bowlV) * 0.62) < 0.20);
  check('全部宠物聚到食盆边', near.length === G.pets.length,
    `只有 ${near.length}/${G.pets.length} 只；盆@${bowlU},${bowlV}；`
    + G.pets.map(p => `${p.mode}@${p.u.toFixed(2)},${p.v.toFixed(2)}`).join(' '));
  check('宠物正在吃', G.pets.every(p => p.mode === 'eat'),
    G.pets.map(p => `${p.mode}@${p.u.toFixed(3)},${p.v.toFixed(3)}`
      + (p.tu !== null ? `→${p.tu.toFixed(3)},${p.tv.toFixed(3)}` : '(已到)')
      + `[eat=${!!p.eating}]`).join('  '));
  check('宠物面朝食盆', G.pets.every(p => p.flip === (bowlU < p.u)),
    G.pets.map(p => `flip=${p.flip}@${p.u.toFixed(2)}`).join(' '));
  run(300);              // 吃完 + 结算
  check('吃完加了爱心', G.state.hearts > hearts0, `${hearts0} → ${G.state.hearts}`);
  check('吃完退出进食状态', G.pets.every(p => p.mode !== 'eat' && !p.eating),
    G.pets.map(p => p.mode + (p.eating ? '(eating)' : '')).join(','));
  check('饱腹度回满', G.state.stats.hunger === 100);

  head('1.5 · 食盆状态：吃完要变空');
  {
    const bowlImg = () => {
      const im = bowlAct && bowlAct.img;
      return im ? im.getAttribute('src').split('/').pop() : '?';
    };
    check('没喂饭时盆是空的', bowlImg() === 'bowl_empty.png', bowlImg());
    G.serveFood('🍖', 300, 300);
    run(25);
    check('倒进去后盆是满的', bowlImg() === 'bowl_food.png', bowlImg());
    run(150);
    const mid = bowlImg();
    check('吃到一半盆里只剩半碗', mid === 'bowl_half.png' || mid === 'bowl_empty.png', mid);
    run(320);
    check('吃完盆空了', bowlImg() === 'bowl_empty.png', bowlImg());
    check('三张碗图都能加载', ['bowl_food', 'bowl_half', 'bowl_empty'].every((n) => {
      const im = bowlAct.imgs.get(`props/${n}.png`);
      return im && im.complete && im.naturalWidth > 0;
    }), '有图 404');
  }

  head('2 · 洗澡：宠物要进到浴缸里');
  G.openBath();
  run(500);              // 走到缸边 → 跳进去 → 坐定，全部由主循环驱动
  check('浴缸出现了', G.flags.tub);
  check('进入洗澡状态', G.flags.bath);
  check('宠物在缸里 (inTub)', !!P().inTub);
  // 缸的位置是按屏幕比例动态算的（房间加宽后），不能写死
  check('宠物坐到缸中心',
    Math.hypot(P().u - G.SPOT.tub.u, (P().v - G.SPOT.tub.v) * 0.62) < 0.05,
    `宠物 ${P().u.toFixed(2)},${P().v.toFixed(2)} 缸 ${G.SPOT.tub.u.toFixed(2)},${G.SPOT.tub.v.toFixed(2)}`);
  check('在缸里是坐姿（比站姿更像泡澡）', P().pose === 'sit',
    `pose=${P().pose} mode=${P().mode} frames=${(P().frames||[]).join('/')}`);
  // 语义是"缸装得下宠物"，所以直接和缸比，别和自身基准比（基准会调）
  {
    const tubEl = fr.contentDocument.querySelector('.actor img[src*="tub"]');
    const tubAct = tubEl && G.stage.actors.find((a) => a.el === tubEl.closest('.actor'));
    check('在缸里缩小到装得下', !!tubAct && P().w < tubAct.w * 0.6,
      `宠物 ${P().w.toFixed(1)} vs 缸 ${tubAct ? tubAct.w : '?'}`);
  }
  check('宠物被抬高到水面', P().extraY > 10, `extraY=${P().extraY}`);
  const petZ = +P().el.style.zIndex, tubZ = +[...fr.contentDocument.querySelectorAll('.actor')]
    .filter(e => e.querySelector('img')?.src.includes('tub'))[0]?.style.zIndex;
  check('宠物画在浴缸后面（才像在缸里）', petZ < tubZ, `pet z=${petZ} tub z=${tubZ}`);
  check('洗澡时宠物不乱走', P().tu === null);
  // 用【全屏搓动层】走真实输入路径，而不是直接调函数
  const bl = fr.contentDocument.getElementById('brush-layer');
  check('洗澡时出现全屏搓动层', !!bl && bl.classList.contains('on'),
    bl ? bl.className : '没有这个层');
  if (bl && bl.classList.contains('on')) {
    const before = G.state.stats.clean;
    bl.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true, clientX: 200, clientY: 300, pointerId: 1 }));
    for (let i = 0; i < 30; i++) {
      bl.dispatchEvent(new W.PointerEvent('pointermove', {
        bubbles: true, clientX: 200 + (i % 2 ? 60 : 0), clientY: 300 + i * 3, pointerId: 1,
      }));
      run(2);
    }
    bl.dispatchEvent(new W.PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    check('在屏幕任意处划动就能搓出泡泡', !G.flags.bath || G.state.stats.clean > before,
      `bath=${G.flags.bath} clean=${G.state.stats.clean}`);
  }
  for (let i = 0; i < 25; i++) { G.scrubProgress(); run(4); }
  run(200);
  check('搓完自动结束', !G.flags.bath);
  check('清洁度回满', G.state.stats.clean === 100);
  check('宠物离开浴缸', !P().inTub && P().extraY === 0);

  head('3 · 睡觉');
  G.toggleNight();
  run(200);              // 够走到窝里躺下，又不到自动天亮的 9s
  check('进入夜晚', G.flags.night);
  check('全部宠物躺下睡了', G.pets.every(p => p.mode === 'sleep'),
    G.pets.map(p => `${p.mode}@${p.u.toFixed(2)},${p.v.toFixed(2)}`
      + (p.tu !== null ? `→${p.tu.toFixed(2)},${p.tv.toFixed(2)}` : '(到)')).join('  ')
      + ` 窝@${(G.furni.find(f=>f.def.id==='bed')||{}).u?.toFixed(2)},${(G.furni.find(f=>f.def.id==='bed')||{}).v?.toFixed(2)}`);
  const bed = G.furni.find(f => f.def.id === 'bed');
  if (bed) {
    const near = G.pets.filter((p) => Math.hypot(p.u - bed.u, (p.v - bed.v) * 0.62) < 0.30);
    check('睡在狗窝附近', near.length >= Math.min(2, G.pets.length),
      `${near.length}/${G.pets.length} 只；窝@${bed.u.toFixed(2)},${bed.v.toFixed(2)}；`
      + G.pets.map((p) => `${p.u.toFixed(2)},${p.v.toFixed(2)}`).join(' '));
  }
  G.toggleNight();
  run(60);
  check('天亮后醒来', !G.flags.night && G.pets.every(p => p.mode !== 'sleep'));

  head('4 · 梳毛');
  G.startGroom();
  run(60);
  check('进入梳毛状态', G.flags.groom);
  check('梳毛时宠物坐下不乱跑', P().mode === 'sit' && P().tu === null, P().mode);
  {
    const bl2 = fr.contentDocument.getElementById('brush-layer');
    check('梳毛时也有全屏搓动层', !!bl2 && bl2.classList.contains('on'));
  }
  // 再点一次应该能收工 —— 不然状态会永久卡住
  G.startGroom();
  run(20);
  check('再点梳毛能退出（不会卡死）', !G.flags.groom);
  G.startGroom(); run(10);
  check('梳毛已开始', G.flags.groom);
  G.goPark();            // 梳毛中直接去院子，应该被自动放行
  await sleep(950); run(60);
  check('梳毛中也能去院子（自动取消梳毛）', G.scene === 'park', G.scene);
  G.goHome(); await sleep(950); run(60);

  head('5 · 商店与摆放');
  G.state.hearts = 500;
  const n0 = G.furni.length;
  const shopItem = W.document ? null : null;
  const notOwned = ['bed','cushion','ball','yarn','bone','plant','lamp','frame'].find(id => !G.state.decor[id]);
  if (notOwned) {
    const f = { id: notOwned };
    // 通过 UI 路径买，验证真实链路
    const el = fr.contentDocument.querySelector(`#shop .shop-item[data-id="${notOwned}"]`);
    check('商店条目存在', !!el, notOwned);
    if (el) {
      el.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      run(30);
      check('买下后出现在场景里', G.furni.length === n0 + 1, `${n0} → ${G.furni.length}`);
      check('买下后写入存档', !!G.state.decor[notOwned]);
    }
  } else line('warn', '  · 家具已全部拥有，跳过购买测试');
  check('家具都落在地面范围内', G.furni.every(f => f.wall || (f.v >= 0 && f.v <= 1.05)),
    G.furni.map(f => f.def.id + ':' + f.v.toFixed(2)).join(' '));
  const frame = G.furni.find(f => f.def.id === 'frame');
  if (frame) check('画框挂在墙上而不是地上', frame.wall === true);

  head('6 · 切换宠物');
  G.setActive(1);
  run(20);
  check('当前宠物切到第 2 只', G.state.active === 1);
  const chips = fr.contentDocument.querySelectorAll('#chips .chip:not(.add)');
  check('头像数量对得上', chips.length === G.pets.length, `${chips.length} vs ${G.pets.length}`);
  G.setActive(0);

  head('6.5 · 睡觉/洗澡中途切换不会锁死');
  G.openBath(); run(500);
  check('洗澡已开始', G.flags.bath);
  G.goPark(); await sleep(950); run(60);
  check('洗澡中去院子会先收尾而不是卡住', G.scene === 'park' || !G.flags.bath, `scene=${G.scene} bath=${G.flags.bath}`);
  if (G.scene !== 'park') { G.goPark(); await sleep(950); run(60); }
  G.goHome(); await sleep(950); run(60);

  head('6.8 · 换装（真的穿上）');
  G.state.hearts = 500;
  {
    const p0 = G.pets[0];
    G.setActive(0); run(5);
    const wdItem = fr.contentDocument.querySelector('#wardrobe .wd-item[data-id="strawhat"]');
    check('衣柜里有草帽', !!wdItem);
    if (wdItem) {
      wdItem.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      run(10);
      check('存档记录穿上了', G.state.pets[0].equipped.includes('strawhat'),
        JSON.stringify(G.state.pets[0].equipped));
      const worn = p0.el.querySelectorAll('.wear .wear-item');
      check('宠物身上真的出现了服饰', worn.length > 0, `${worn.length} 件`);
      if (worn.length) {
        const im = worn[0];
        const okSrc = im.getAttribute('src').includes('strawhat');
        check('贴的是草帽', okSrc, im.getAttribute('src'));
        const top = parseFloat(im.style.top), left = parseFloat(im.style.left);
        const A = W.__game ? null : null;
        check('帽子贴在头顶附近（不是飘在半空）', top >= 0 && top <= 40,
          `top=${top}% left=${left}%`);
        check('服饰宽度合理', parseFloat(im.style.width) > 10 && parseFloat(im.style.width) < 90,
          im.style.width);
      }
      // 再点一次脱下
      wdItem.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      run(10);
      check('再点一下能脱下来', !G.state.pets[0].equipped.includes('strawhat')
        && p0.el.querySelectorAll('.wear .wear-item').length === 0);
      // 同槽位互斥
      const hat = fr.contentDocument.querySelector('#wardrobe .wd-item[data-id="strawhat"]');
      const party = fr.contentDocument.querySelector('#wardrobe .wd-item[data-id="partyhat"]');
      hat.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true })); run(5);
      party.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true })); run(5);
      check('同一个部位只能戴一件', G.state.pets[0].equipped.filter(id =>
        ['strawhat', 'partyhat', 'bow', 'flower'].includes(id)).length === 1,
        JSON.stringify(G.state.pets[0].equipped));
      // 换装是按宠物记的
      G.setActive(1); run(5);
      check('换装是按每只宠物分别记录的', !G.state.pets[1].equipped.includes('partyhat'));
      G.setActive(0);
    }
  }

  head('7 · 领养');
  G.state.hearts = 500;
  const before = G.pets.length;
  const full = before >= 8;
  G.adoptNew('tuxedo', 110);
  run(300);
  check('领养后多了一只', full ? G.pets.length === before : G.pets.length === before + 1,
    `${before} → ${G.pets.length}${full ? '（已住满，正确地拒绝了）' : ''}`);
  {
    const last = G.pets[G.pets.length - 1];
    check('新宠物走进了场景', last.u > 0.02 && last.u < 0.98 && last.v > 0.02 && last.v <= 1.02,
      `位置 ${last.u.toFixed(2)},${last.v.toFixed(2)}`);
  }
  check('存档同步', G.state.pets.length === G.pets.length);

  head('7.5 · 生宝宝');
  {
    G.state.hearts = 500;
    // 保证至少有两只成年
    while (G.pets.length < 2) { G.adoptNew('shiba', 0); run(30); }
    const n0 = G.pets.length;
    const adults = G.state.pets.map((d, i) => (d.baby ? -1 : i)).filter((i) => i >= 0);
    check('有两只以上成年宠物', adults.length >= 2, `${adults.length} 只`);

    // 通过 UI 选爸妈
    fr.contentDocument.getElementById('baby-panel').classList.add('show');
    G.refreshBabyPanel && G.refreshBabyPanel();
    const items = fr.contentDocument.querySelectorAll('#baby-panel .baby-item');
    check('生宝宝面板列出了候选爸妈', items.length >= 2, `${items.length} 个`);
    if (items.length >= 2) {
      items[0].dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      items[1].dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      run(40);                                  // 走到一起亲亲
      run(60);
      const preg = G.state.pets.find((d) => d.pregnant !== undefined);
      check('有一只怀孕了', !!preg, JSON.stringify(G.state.pets.map((d) => d.name + ':' + d.pregnant)));
      if (preg) {
        check('怀孕的那只在 HUD 上有标记', !!fr.contentDocument.querySelector('#chips .preg'));
        // 推进到出生
        run(Math.ceil(46 * 30));
        check('宝宝出生了', G.pets.length === n0 + 1, `${n0} → ${G.pets.length}`);
        const babyD = G.state.pets[G.state.pets.length - 1];
        check('新成员是宝宝', !!babyD.baby, JSON.stringify(babyD));
        check('宝宝记录了妈妈', !!babyD.mom, babyD.mom || '没有');
        check('宝宝的品种继承自父母', G.state.pets.slice(0, -1).some((d) => d.breed === babyD.breed),
          babyD.breed);
        const babyP = G.pets[G.pets.length - 1];
        check('宝宝比成年小', babyP.w < G.pets[0].w, `${babyP.w.toFixed(1)} vs ${G.pets[0].w.toFixed(1)}`);
        check('宝宝用的是宝宝贴图',
          babyP.img && babyP.img.getAttribute('src').includes('_baby'),
          babyP.img ? babyP.img.getAttribute('src') : '无');
        check('宝宝贴图能加载', babyP.img && babyP.img.complete && babyP.img.naturalWidth > 0);
        // 长大
        run(Math.ceil(181 * 30));
        check('陪够时间后宝宝会长大', !G.state.pets[G.state.pets.length - 1].baby);
      }
    }
  }

  head('8 · 公园');
  G.goPark();
  await sleep(900);
  run(200);
  check('切到公园场景', G.scene === 'park', G.scene);
  check('公园背景已换', G.stage.bgEl.getAttribute('src').includes('park'));
  check('出现了朋友宠物', !!G.friend);
  check('宠物都在草地范围内', G.pets.every(p => p.v >= 0 && p.v <= 1.02));
  G.throwBall();
  run(500);
  check('扔球不会卡死', true);
  G.blowBubbles();
  run(60);
  check('吹泡泡正常', true);
  G.goHome();
  await sleep(900);
  run(60);
  check('能回家', G.scene === 'home', G.scene);
  check('回家后工具栏是家里那套', !!fr.contentDocument.querySelector('#toolbar .btn[data-act="feed"]'));
  check('回家后食盆还在', !!fr.contentDocument.querySelector('img[src*="bowl_food"]'));

  head('8.5 · 物理与交互');
  /* 这一段要干净隔离：宠物会主动跑去拱球（这正是我们要的交互），
     所以测物理本身时必须先把它们支到角落、按住 AI、关掉碰撞。 */
  G.state.hearts = 500;
  for (const id of ['ball', 'plant']) {
    if (G.furni.some(f => f.def.id === id)) continue;
    if (G.state.decor[id]) delete G.state.decor[id];
    const el = fr.contentDocument.querySelector(`#shop .shop-item[data-id="${id}"]`);
    if (el) { el.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true })); run(20); }
  }
  const freeze = (on) => {
    for (const p of G.pets) {
      p.stop(); p.agent.ghost = on;
      p.nextThink = on ? 1e9 : 0;
      if (on) { p.u = 0.08; p.v = 0.12; }
    }
  };

  const ballA = G.furni.find(f => f.def.id === 'ball');
  check('球是刚体', !!(ballA && ballA.body), '没有 body');
  if (ballA && ballA.body) {
    freeze(true);
    // ① 踢一脚会飞、会往前滚、会自转
    ballA.u = 0.30; ballA.v = 0.42; ballA.h = ballA.body.hr; ballA.spin = 0;   // 空地起步，别压在盆/碗上
    ballA.body.kick(0.9, 0, 0.5);
    run(3);
    check('踢一脚球会飞起来', ballA.h > ballA.body.hr + 0.001, `h=${ballA.h.toFixed(4)}`);
    run(18);
    check('球会往前滚', ballA.u > 0.37, `u=${ballA.u.toFixed(3)}`);
    check('球会自转（滚动感）', Math.abs(ballA.spin) > 5, `spin=${(ballA.spin || 0).toFixed(0)}`);
    // ② 没人碰时会自己停
    run(260);
    check('没人碰时球会自己停下来', ballA.body.sleep,
      `速度 ${Math.hypot(ballA.body.vu, ballA.body.vv).toFixed(3)}`);
    check('球不会滚出场景', ballA.u > 0 && ballA.u < 1 && ballA.v > 0 && ballA.v <= 1.02,
      `${ballA.u.toFixed(2)},${ballA.v.toFixed(2)}`);
    // ③ 撞墙反弹
    ballA.u = 0.5; ballA.v = 0.42; ballA.h = ballA.body.hr;
    const u1 = ballA.u;
    ballA.body.kick(2.0, 0, 0.05);
    let touchedWall = false;
    for (let i = 0; i < 90; i++) { run(1); if (ballA.u > 0.9) touchedWall = true; }
    check('球撞墙会反弹回来', touchedWall && (ballA.body.vu <= 0.01 || ballA.u < 0.9),
      `到过墙边=${touchedWall} u=${ballA.u.toFixed(2)} vu=${ballA.body.vu.toFixed(2)}`);
    // ④ 宠物撞上去球会被撞飞
    freeze(false);
    for (const p of G.pets) { p.stop(); p.nextThink = 1e9; }
    ballA.u = 0.5; ballA.v = 0.42; ballA.h = ballA.body.hr; ballA.body.stop();
    const p0 = G.pets[0];
    p0.u = 0.42; p0.v = 0.42; p0.vu = 0.6; p0.agent.vu = 0.6; p0.agent.vv = 0;
    const u0 = ballA.u;
    run(10);
    check('宠物撞上去球会被撞飞', ballA.u > u0 + 0.003 || ballA.h > ballA.body.hr + 0.002,
      `球 ${u0.toFixed(3)} → ${ballA.u.toFixed(3)}, h=${ballA.h.toFixed(4)}`);
  }

  // ⑤ 家具是实心的：宠物不能穿过去
  const plant = G.furni.find(f => f.def.id === 'plant');
  if (plant && plant.stat) {
    const p0 = G.pets[0];
    p0.stop(); p0.agent.ghost = false;
    p0.u = plant.u; p0.v = plant.v;          // 强行塞进盆栽里
    run(6);
    const d = Math.hypot(p0.u - plant.u, (p0.v - plant.v) * 0.62);
    const inWorld = G.phys.statics.includes(plant.stat);
    check('宠物会被家具挡开（不穿模）', d > plant.stat.r * 0.6,
      `距离 ${d.toFixed(3)} 半径 ${plant.stat.r} `
      + `stat在物理世界=${inWorld} statics数=${G.phys.statics.length} `
      + `stat位置=${plant.stat.u.toFixed(2)},${plant.stat.v.toFixed(2)} `
      + `盆栽位置=${plant.u.toFixed(2)},${plant.v.toFixed(2)} `
      + `agent数=${G.phys.agents.length} ghost=${p0.agent.ghost}`);
  } else line('warn', '  · 没有盆栽，跳过家具碰撞测试');

  // ⑥ 食盆是实心的：宠物不能站进盆里
  const bowlEl2 = fr.contentDocument.querySelector('.actor img[src*="bowl_"]');
  const bowlAct6 = bowlEl2 && G.stage.actors.find(a => a.el === bowlEl2.closest('.actor'));
  const bowlStat = bowlAct6 && G.phys.statics.find(s2 => s2.actor === bowlAct6);
  if (bowlStat) {
    const p0 = G.pets[0];
    p0.stop(); p0.agent.ghost = false; p0.nextThink = 1e9;
    p0.u = bowlStat.u; p0.v = bowlStat.v;
    run(6);
    const d = Math.hypot(p0.u - bowlStat.u, (p0.v - bowlStat.v) * 0.62);
    check('宠物不会站进食盆里', d > bowlStat.r * 0.6, `距离 ${d.toFixed(3)} 半径 ${bowlStat.r}`);
  } else line('warn', '  · 食盆没有碰撞体');

  // ⑦ 宠物之间不重叠
  if (G.pets.length > 1) {
    G.pets[0].stop(); G.pets[1].stop();
    G.pets[0].agent.ghost = G.pets[1].agent.ghost = false;
    G.pets[0].u = 0.5; G.pets[0].v = 0.6;
    G.pets[1].u = 0.5; G.pets[1].v = 0.6;
    run(12);
    const dd = Math.hypot(G.pets[0].u - G.pets[1].u, (G.pets[0].v - G.pets[1].v) * 0.62);
    check('宠物不会叠在一起', dd > 0.05, `距离 ${dd.toFixed(3)}`);
  }
  for (const p of G.pets) p.nextThink = 0;    // 恢复 AI

  head('8.8 · 镜头：拖到哪停在哪');
  {
    const st = G.stage;
    const start = st.camU;
    // 模拟往左拖一段
    for (let i = 0; i < 12; i++) st.nudge(30);
    run(40);
    const afterDrag = st.camU;
    check('拖动能移动镜头', Math.abs(afterDrag - start) > 0.02,
      `${start.toFixed(3)} → ${afterDrag.toFixed(3)}`);
    st.release();
    run(120);                       // 松手后等 4 秒
    check('松手后镜头不会弹回原位', Math.abs(st.camU - afterDrag) < 0.03,
      `松手后 ${st.camU.toFixed(3)}，拖到的是 ${afterDrag.toFixed(3)}`);
    check('镜头不会越界', st.camU >= -0.02 && st.camU <= 1.5, `camU=${st.camU.toFixed(3)}`);
    // 宠物走到很远处时，镜头应该会跟上
    st.manualUntil = 0;
    const p0 = G.pets[0];
    G.setActive(0);
    p0.stop(); p0.u = 0.02; p0.v = 0.6;
    run(200);
    const sx = st.ground(p0.u, p0.v).x;
    check('宠物走到边上时镜头会跟上', sx > -0.05 && sx < 1.05, `宠物屏幕位置 ${sx.toFixed(2)}`);
  }

  head('8.9 · 日夜 / 天气 / 四季');
  {
    const wd = G.world;
    check('环境系统在跑', !!wd, '没有 world');
    if (wd) {
      check('默认跟着真实时间', wd.auto === true);
      check('时段是四个之一', ['dawn', 'day', 'dusk', 'night'].includes(wd.curPhase), wd.curPhase);
      check('季节是四个之一', ['spring', 'summer', 'autumn', 'winter'].includes(wd.season), wd.season);
      // 换季要换背景图
      for (const sea of ['spring', 'summer', 'autumn', 'winter']) {
        wd.set('season', sea);
        G.reskin();
        run(4);
        const src = G.stage.bgEl.getAttribute('src');
        check(`切到${sea}会换背景图`, src.includes(sea), src.split('/').pop());
      }
      // 背景图都要能加载
      await sleep(700);
      check('四季背景都能加载', G.stage.bgEl.complete && G.stage.bgEl.naturalWidth > 0,
        `naturalWidth=${G.stage.bgEl.naturalWidth}`);
      // 下雪要有雪花
      wd.set('season', 'winter'); wd.set('weather', 'snow'); run(4);
      const snow = fr.contentDocument.querySelectorAll('#env .snow');
      check('下雪时有雪花飘', snow.length > 10, `${snow.length} 片`);
      // 下雨要有雨滴
      wd.set('weather', 'rain'); run(4);
      const drops = fr.contentDocument.querySelectorAll('#env .drop');
      check('下雨时有雨滴', drops.length > 10, `${drops.length} 滴`);
      // 室内雨雪只能落在窗外：粒子层必须和背景图严丝合缝地重合，
      // 否则那个按背景图比例定的窗洞裁剪框会歪到墙上去
      {
        const bg = G.stage.bgEl.getBoundingClientRect();
        const fa = wd.fallEl.getBoundingClientRect();
        check('室内雨雪限制在窗外', wd.fallEl.classList.contains('win'),
          `class=${wd.fallEl.className}`);
        check('雨雪层和背景图对齐',
          Math.abs(bg.left - fa.left) < 2 && Math.abs(bg.width - fa.width) < 2,
          `背景 ${bg.left.toFixed(0)}+${bg.width.toFixed(0)} / 粒子 ${fa.left.toFixed(0)}+${fa.width.toFixed(0)}`);
      }
      // 到了院子就该满屏下，而且不能留着室内那份位移。
      // goPark 是过场动画里换的场景，得等真实时间，run() 推的是模拟时钟
      G.goPark(); await sleep(900); run(6);
      {
        const fa = wd.fallEl;
        check('院子里雨雪是满屏的', !fa.classList.contains('win'), `class=${fa.className}`);
        check('出屋后粒子层位移已还原', !fa.style.transform && !fa.style.width,
          `w=${fa.style.width || '-'} t=${fa.style.transform || '-'}`);
      }
      G.goHome(); await sleep(900); run(6);
      check('回屋后又只下在窗外', wd.fallEl.classList.contains('win'));

      // 夜晚要压暗
      wd.set('phase', 'day'); run(4);
      const dayF = G.stage.bgEl.style.filter;
      wd.set('phase', 'night'); run(4);
      const nightF = G.stage.bgEl.style.filter;
      const bri = (f) => parseFloat((f.match(/brightness\(([\d.]+)\)/) || [])[1] || 1);
      check('夜晚比白天暗', bri(nightF) < bri(dayF) * 0.85,
        `白天 ${bri(dayF).toFixed(2)} / 夜晚 ${bri(nightF).toFixed(2)}`);
      // 面板能开
      G.openEnvPanel();
      run(4);
      const panel = fr.contentDocument.getElementById('env-panel');
      check('天气面板能打开', !!panel && panel.classList.contains('show'));
      check('面板列出了所有选项',
        panel && panel.querySelectorAll('.env-btn').length >= 12,
        `${panel ? panel.querySelectorAll('.env-btn').length : 0} 个按钮`);
      panel.classList.remove('show');
      wd.setAuto();
      run(4);
      G.reskin();
    }
  }

  head('9 · 边界');
  for (const p of G.pets) { p.u = 5; p.v = 5; }
  run(30);
  check('宠物不会跑出场景', G.pets.every(p => p.u <= 1 && p.v <= 1.05),
    G.pets.map(p => `${p.u.toFixed(1)},${p.v.toFixed(1)}`).join(' '));
  check('全程无脚本错误', !W.__err, W.__err || '');

  sum.textContent = `${fail === 0 ? '✅ 全部通过' : '❌ 有问题'}　通过 ${pass} / 失败 ${fail}`;
  sum.className = fail === 0 ? 'ok' : 'bad';
  document.title = `SELFTEST pass=${pass} fail=${fail}`;
}
main().catch(e => {
  sum.textContent = '❌ 自检崩溃: ' + e.message;
  document.title = 'SELFTEST crash=' + e.message;
  console.error(e);
});
</script>
</body>
</html>
