<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ada的宠物小窝</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfe3ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宠物小窝">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<style>
/* 首屏加载动画：内联，保证秒出画面 */
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#cfe3ee;
  overscroll-behavior:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(#e8f2f8,#cfe3ee);z-index:999;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
.paw{font-size:15vmin;animation:pawbob 1s ease-in-out infinite}
@keyframes pawbob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-2vmin) rotate(8deg)}}
#boot p{color:#a5623a;font-size:3vmin;margin-top:2vmin;letter-spacing:.3em}
#ver{position:fixed;right:.6vmin;bottom:.4vmin;z-index:5000;font-size:1.5vmin;
  color:rgba(120,90,60,.55);pointer-events:none;letter-spacing:.05em}
</style>
<link rel="stylesheet" href="css/main.css">
<!-- 模块预载：不写的话浏览器要先下 main.js、解析出 import 才知道还有 7 个模块，
     白白多排一轮队。老 Safari 不认这行，忽略掉也没副作用。 -->
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/stage.js">
<link rel="modulepreload" href="js/pet.js">
<link rel="modulepreload" href="js/world.js">
<link rel="modulepreload" href="js/phys.js">
<link rel="modulepreload" href="js/data.js">
<link rel="modulepreload" href="js/save.js">
<link rel="modulepreload" href="js/audio.js">
<script>
/* 首屏那张背景，本来要等 html → js → 解析 import → 跑起来 才发出请求，
   白等一个来回。这里立刻猜出该用哪张先下起来：有存档就是当季的家，
   没有就是领养小屋。猜错了也只是多下一张，不影响正确性。
   （季节判断和 world.js 的 seasonByClock 一致，改那边记得同步改这里） */
(function () {
  try {
    var m = new Date().getMonth() + 1;
    var s = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer'
          : m >= 9 && m <= 11 ? 'autumn' : 'winter';
    var f = localStorage.getItem('pet-home-ada-v1') ? 'bg_home_' + s + '.jpg' : 'bg_adopt.jpg';
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'image'; l.href = 'assets/art/bg/' + f;
    document.head.appendChild(l);
  } catch (e) { /* 隐私模式下 localStorage 会抛，预载只是锦上添花 */ }
})();
</script>
</head>
<body>
<div id="boot"><div class="paw">🐾</div><p>小窝开门啦</p></div>
<div id="game"></div>
<div id="ver"></div>
<script type="module" src="js/main.js"></script>
<script>
window.addEventListener('error',function(e){
  /* 把首个错误写进 title，方便无头环境 --dump-dom 定位（对孩子不可见） */
  if(!window.__err){window.__err=e.message;document.title='ERR: '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno;}
  var b=document.getElementById('boot');
  if(b&&!b.classList.contains('gone')){
    b.innerHTML='<p style="font-size:2.5vmin">哎呀，小窝的门卡住了，请再试一次</p>'+
    '<button onclick="location.reload()" style="margin-top:2vmin;font-size:3vmin;padding:1vmin 4vmin;border:none;border-radius:2vmin;background:#ff9d6c;color:#fff">重新打开</button>';
  }
});
/* ?nosw=1：自检页用，避免 SW 更新时把 iframe 重载掉 */
if('serviceWorker' in navigator && location.search.indexOf('nosw=1')<0 && window.top===window.self){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  /* 新版 SW 接管后自动刷一次，避免拿着旧缓存的 JS 跑新页面 */
  var reloaded=false;
  navigator.serviceWorker.addEventListener('message',function(e){
    if(e.data&&e.data.type==='sw-updated'&&!reloaded){reloaded=true;location.reload()}
  });
}
</script>
</body>
</html>
